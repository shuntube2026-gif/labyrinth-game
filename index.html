<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ラビリンスマーブル</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5c2e0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ラビリンスマーブル">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* ─────────────────────────── リセット・ルート ─────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --wood-dk:#5c2e0e;
  --wood-md:#a0692b;
  --wood-lt:#e8cb8a;
  --wood-bg:#d4b06a;
  --ink:#2b1607;
  --panel:#fff8e8;
}
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:8px 0 24px;
  background:linear-gradient(150deg,#f5e1b0 0%,#d2a860 50%,#a07030 100%);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  overflow-x:hidden;
}
/* ─────────────────────────── アプリ全体 ─────────────────────────── */
#app{
  width:min(98vw,660px);
  display:flex;
  flex-direction:column;
  gap:8px;
  user-select:none;
}
/* ─────── AdMob バナー広告スペース（Android TWA のみ表示） ─────── */
#admob-banner-space{
  height:0;
  width:100%;
  flex-shrink:0;
  transition:height .2s;
  background:transparent;
  overflow:hidden;
}
/* ─────────────────────────── HUD ─────────────────────────── */
#hud{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  padding:0 4px;
}
#stageLabel{
  font-size:16px;
  font-weight:800;
  text-shadow:0 1px 0 rgba(255,255,255,.6);
}
#stageName{
  font-size:11px;
  color:rgba(43,22,7,.7);
  margin-top:1px;
}
#statsBadges{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  font-size:12px;
}
.badge{
  padding:4px 8px;
  border:1px solid rgba(92,46,14,.28);
  border-radius:999px;
  background:rgba(255,248,232,.82);
  box-shadow:0 1px 4px rgba(72,35,8,.12);
  white-space:nowrap;
}
.badge b{font-size:13px;font-weight:700}
/* ─────────────────────────── 盤面外枠 ─────────────────────────── */
#boardWrap{
  position:relative;
  padding:14px;
  border-radius:22px;
  background:linear-gradient(135deg,#c07a30,#f0ca80 20%,#8a4c18 80%,#5c2e0e);
  box-shadow:
    inset 0 0 0 4px rgba(60,26,6,.4),
    inset 0 0 0 14px rgba(240,200,140,.22),
    0 14px 36px rgba(60,30,8,.38),
    0 4px 8px rgba(60,30,8,.2);
}
/* ─────────────────────────── Canvas ─────────────────────────── */
canvas{
  display:block;
  width:100%;
  height:auto;
  border-radius:14px;
  touch-action:none;
  cursor:crosshair;
  box-shadow:
    inset 0 0 0 3px rgba(60,26,6,.45),
    inset 0 0 32px rgba(80,36,8,.3);
}
/* ─────────────────────────── オーバーレイ ─────────────────────────── */
#overlay{
  position:absolute;
  inset:14px;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  pointer-events:none;
  opacity:0;
  transition:opacity .25s ease;
  padding:16px;
}
#overlay.show{opacity:1;pointer-events:auto}
#overlay.fail{background:rgba(60,10,0,.62)}
#overlay.clear{background:rgba(0,70,20,.54)}
#overlay.allclear{background:rgba(0,40,80,.65)}
.ov-title{
  font-size:clamp(22px,5vw,36px);
  font-weight:900;
  color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,.6);
  margin-bottom:8px;
}
.ov-sub{
  font-size:clamp(13px,3vw,18px);
  color:rgba(255,255,255,.9);
  text-shadow:0 1px 6px rgba(0,0,0,.5);
  margin-bottom:12px;
}
.ov-stars{
  font-size:clamp(28px,6vw,44px);
  margin:8px 0;
  letter-spacing:4px;
}
/* 獲得済み星（金色）*/
.star-gold{
  color:#f5c518;
  text-shadow:0 0 8px rgba(245,197,24,0.80),0 1px 2px rgba(0,0,0,0.5);
}
/* 未獲得星（薄いグレー）*/
.star-empty{
  color:rgba(255,255,255,0.28);
  text-shadow:none;
}
/* HUDバッジ内の星 */
.star-hud-gold{
  color:#d4a00a;
  text-shadow:0 0 4px rgba(212,160,10,0.6);
}
.star-hud-empty{
  color:rgba(100,80,40,0.35);
}
.ov-btn{
  margin-top:10px;
  padding:10px 22px;
  border:none;
  border-radius:12px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  pointer-events:auto;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  transition:transform .1s;
}
.ov-btn:active{transform:translateY(2px)}
.ov-btn-restart{background:#e85;color:#fff}
.ov-btn-next{background:#3a8;color:#fff}
.ov-btn-all{background:#48a;color:#fff}
/* ─────────────────────────── コントロール ─────────────────────────── */
#controls{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:7px;
}
button.ctrl{
  appearance:none;
  border:1px solid rgba(92,46,14,.3);
  border-radius:10px;
  padding:7px 13px;
  background:linear-gradient(#fffaf0,#e8d090);
  color:var(--ink);
  font-weight:700;
  font-size:12px;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(72,35,8,.14);
  transition:filter .1s,transform .1s;
}
button.ctrl:hover{filter:brightness(1.05)}
button.ctrl:active{transform:translateY(1px)}
button.ctrl:disabled{opacity:.42;cursor:default;transform:none}
button.ctrl.primary{background:linear-gradient(#3a9944,#1e6b2e);color:#fff;border-color:#1a6029}
button.ctrl.danger{background:linear-gradient(#b04020,#7a2c12);color:#fff;border-color:#6a2010}
#sensBox{
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 9px;
  border-radius:10px;
  background:rgba(255,248,232,.7);
  border:1px solid rgba(92,46,14,.2);
  font-size:11px;
}
#sensSlider{width:90px;accent-color:#8a4018}
/* ─────────────────────────── メッセージ・デバッグ ─────────────────────────── */
#msg{
  min-height:20px;
  text-align:center;
  font-size:12px;
  color:rgba(43,22,7,.78);
  padding:0 4px;
}
#dbgPanel{
  display:none;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid rgba(92,46,14,.22);
  background:rgba(255,248,232,.88);
  font-size:11px;
  line-height:1.75;
  color:var(--ink);
  white-space:pre-wrap;
  word-break:break-all;
}
#dbgPanel.show{display:block}
/* ─────────────────────────── 操作説明 ─────────────────────────── */
#guide{
  font-size:11px;
  text-align:center;
  color:rgba(43,22,7,.58);
  padding:0 4px;
}
kbd{
  display:inline-block;
  padding:1px 4px;
  border-radius:4px;
  border:1px solid rgba(80,44,12,.2);
  background:rgba(255,255,255,.65);
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.1);
  font-size:10px;
}
/* ─────────────────────────── ステージ選択 ─────────────────────────── */
#stageSelect{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  justify-content:center;
  padding:0 4px;
}
.stage-btn{
  width:28px;
  height:28px;
  border-radius:8px;
  border:1px solid rgba(92,46,14,.3);
  background:linear-gradient(#fffaf0,#e8d090);
  color:var(--ink);
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 2px 4px rgba(72,35,8,.12);
  transition:filter .1s,transform .1s;
  padding:0;
}
.stage-btn:hover{filter:brightness(1.08)}
.stage-btn:active{transform:translateY(1px)}
.stage-btn.active{
  background:linear-gradient(#3a9944,#1e6b2e);
  color:#fff;
  border-color:#1a6029;
}
@media(max-width:480px){
  #boardWrap{padding:10px;border-radius:16px}
  #overlay{inset:10px}
}
/* ─────────────────────────── Dパッド（キャンバス外・下） ─────────────────────────── */
#dpad{
  display:none;
  grid-template-columns:repeat(3,84px);
  grid-template-rows:repeat(3,84px);
  gap:7px;
  user-select:none;
}
.dp-btn{
  width:84px;height:84px;
  border-radius:18px;
  border:2px solid rgba(92,46,14,.35);
  background:rgba(255,248,232,.88);
  color:var(--ink);
  font-size:34px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  touch-action:none;
  box-shadow:0 3px 10px rgba(92,46,14,.22),inset 0 1px 0 rgba(255,255,255,.7);
  transition:background .08s,transform .08s;
}
.dp-btn.pressed,.dp-btn:active{background:rgba(160,100,43,.22);transform:scale(.92)}
.dp-empty{background:transparent!important;border:none!important;pointer-events:none;box-shadow:none}
/* コントロールエリア（Dパッド / ジョイスティックを収容） */
#controlArea{
  display:flex;align-items:center;justify-content:center;
  padding:10px 0 4px;min-height:0}
/* オーバーレイはDパッドより上に表示 */
#overlay.show{opacity:1;pointer-events:auto;z-index:20}
/* ─────────────────────────── 設定モーダル ─────────────────────────── */
#settingsOverlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.52);
  display:none;
  align-items:center;justify-content:center;
  z-index:200;
}
#settingsOverlay.show{display:flex}
#settingsCard{
  background:var(--panel);
  border-radius:20px;
  padding:22px 24px;
  min-width:270px;max-width:340px;width:90vw;
  box-shadow:0 8px 32px rgba(0,0,0,.38);
  display:flex;flex-direction:column;gap:10px;
}
#settingsCard h3{font-size:16px;font-weight:800;color:var(--wood-dk);margin-bottom:2px}
.cmo{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 12px;border-radius:12px;
  border:2px solid transparent;cursor:pointer;
  transition:background .12s,border-color .12s;
}
.cmo:hover{background:rgba(160,105,43,.08)}
.cmo.selected{background:rgba(58,153,68,.1);border-color:rgba(58,153,68,.4)}
.cmo input[type=radio]{width:17px;height:17px;margin-top:2px;accent-color:#2e8b3a;flex-shrink:0}
.cmo-label{font-size:14px;font-weight:700;color:var(--ink)}
.cmo-desc{font-size:11px;color:rgba(43,22,7,.6);margin-top:2px}
#settingsClose{
  align-self:flex-end;
  padding:9px 24px;border:none;border-radius:12px;
  background:linear-gradient(#3a9944,#1e6b2e);
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;
  margin-top:6px;box-shadow:0 3px 8px rgba(0,0,0,.2);
}
#settingsClose:active{opacity:.85}

/* ═══ 追加UI ═══ */
/* デバッグ・不要ボタン非表示 */
#dbgBtn,#sensBox,#resetBtn,#settingsBtn,#gyroBtn{display:none!important}
/* ステージ選択を本体から非表示→ドロワーに移動 */
#stageSelect{display:none}
/* ステージ番号センタリング */
.stage-btn{display:flex!important;align-items:center!important;justify-content:center!important}
/* ステージ ロック/クリア済みスタイル */
.stage-btn.locked{opacity:.32;cursor:not-allowed!important;background:linear-gradient(#d8d0c0,#c4bcaa)!important;color:rgba(43,22,7,.25)!important;border-color:rgba(92,46,14,.12)!important}
.stage-btn.cleared{background:linear-gradient(#7bc87e,#49995c)!important;color:#fff!important;border-color:#3a8840!important}
/* ── ハンバーガーボタン（HUDに移動） ── */
#menuBtn{
  width:40px;height:40px;border-radius:12px;
  border:1px solid rgba(92,46,14,.28);
  background:rgba(255,248,232,.82);color:var(--ink);font-size:19px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;font-family:inherit;flex-shrink:0;
  box-shadow:0 1px 4px rgba(72,35,8,.15);transition:background .1s}
#menuBtn:active{background:rgba(92,46,14,.14)}
/* ── ボトムドロワー ── */
#drawerOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,.46);
  z-index:400;display:none;align-items:flex-end}
#drawerOverlay.show{display:flex}
#drawer{
  width:100%;max-height:82vh;background:var(--panel);
  border-radius:22px 22px 0 0;padding:0 16px 36px;
  overflow-y:auto;box-shadow:0 -8px 32px rgba(0,0,0,.3);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.25,.8,.25,1)}
#drawerOverlay.show #drawer{transform:translateY(0)}
.dwr-handle{width:42px;height:4px;background:rgba(92,46,14,.22);border-radius:2px;margin:12px auto 4px}
.dwr-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 0 10px}
.dwr-hdr-title{font-size:16px;font-weight:800;color:var(--wood-dk)}
#drawerClose{
  width:30px;height:30px;border-radius:50%;border:none;
  background:rgba(92,46,14,.12);color:var(--wood-dk);
  font-size:16px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0}
.dwr-sec{border-top:1px solid rgba(92,46,14,.1);padding:12px 0 6px}
.dwr-sec-ttl{font-size:11px;font-weight:700;color:rgba(92,46,14,.55);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
/* ドロワー内ステージ選択表示 */
#drawer #stageSelect{display:flex!important;flex-wrap:wrap;gap:4px;justify-content:flex-start;padding:0}
/* 操作モードボタン */
.ctm-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
.ctm-btn{
  flex:1;min-width:60px;padding:9px 4px;border-radius:10px;
  border:2px solid rgba(92,46,14,.18);background:rgba(255,248,232,.8);
  color:var(--ink);font-size:11px;font-weight:700;cursor:pointer;text-align:center;transition:all .12s}
.ctm-btn.active{background:linear-gradient(#3a9944,#1e6b2e);color:#fff;border-color:#1a6029}
/* 音量・感度スライダー行 */
.vol-row,.sens-row2{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:8px}
.vol-row label,.sens-row2 label{width:56px;font-weight:700}
.vol-row input,.sens-row2 input{flex:1;accent-color:#8a4018}
.vol-num{width:18px;font-size:11px;font-weight:700;text-align:right}
/* ドロワーアクションボタン */
.dwr-btn{
  padding:11px 18px;border-radius:11px;
  border:1px solid rgba(92,46,14,.28);background:linear-gradient(#fffaf0,#e8d090);
  color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;
  transition:filter .1s,transform .1s;margin:3px}
.dwr-btn:active{transform:translateY(1px)}
.dwr-btn.danger{background:linear-gradient(#b04020,#7a2c12);color:#fff;border-color:#6a2010}
/* ── アナログジョイスティック（キャンバス外・下） ── */
#joystick{
  display:none;
  width:180px;height:180px;
  align-items:center;justify-content:center;
  user-select:none;touch-action:none}
#joystickBase{
  width:180px;height:180px;border-radius:50%;
  background:rgba(255,248,232,.78);
  border:3px solid rgba(92,46,14,.35);
  position:relative;
  box-shadow:0 4px 16px rgba(92,46,14,.22),inset 0 1px 0 rgba(255,255,255,.6)}
#joystickKnob{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(145deg,#d4b06a,#a07030);
  border:3px solid rgba(92,46,14,.5);
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  box-shadow:0 4px 12px rgba(60,30,8,.35)}
#joystickKnob.active{background:linear-gradient(145deg,#b89050,#7a5020)}
/* ── タイトルスクリーン ── */
@keyframes ttl-fadein{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes ttl-float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
@keyframes ttl-glow{0%,100%{box-shadow:0 6px 0 #134d20,0 10px 28px rgba(0,0,0,.38),0 0 0 0 rgba(80,200,80,.5)}55%{box-shadow:0 6px 0 #134d20,0 10px 28px rgba(0,0,0,.38),0 0 0 11px rgba(80,200,80,0)}}
@keyframes ttl-marble{0%{transform:translateX(0) rotate(0deg)}100%{transform:translateX(3px) rotate(15deg)}}

#titleScreen{
  position:fixed;inset:0;z-index:600;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:
    repeating-linear-gradient(89deg,transparent 0,transparent 9px,rgba(255,200,110,.022) 9px,rgba(255,200,110,.022) 10px),
    repeating-linear-gradient(91deg,transparent 0,transparent 22px,rgba(0,0,0,.018) 22px,rgba(0,0,0,.018) 23px),
    radial-gradient(ellipse 150% 110% at 50% -5%,#dc8838 0%,#8a4012 42%,#3c1806 100%)}
#titleScreen.hidden{display:none}
#titleScreen::before{
  content:'';position:absolute;
  width:700px;height:700px;border-radius:50%;
  border:1px solid rgba(255,195,80,.07);
  top:50%;left:50%;transform:translate(-50%,-60%);
  box-shadow:0 0 0 80px rgba(255,175,65,.04),0 0 0 160px rgba(255,150,45,.023),0 0 0 250px rgba(255,130,30,.012);
  pointer-events:none}
#titleScreen::after{
  content:'';position:absolute;bottom:-80px;left:50%;transform:translateX(-50%);
  width:120%;height:200px;border-radius:50%;
  background:rgba(0,0,0,.18);filter:blur(40px);pointer-events:none}
.ttl-inner{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  padding:12px 24px 44px;width:100%;max-width:340px;
  text-align:center;
  animation:ttl-fadein .65s cubic-bezier(.16,.84,.44,1) both}
.ttl-preview-wrap{
  width:116px;height:116px;border-radius:22px;
  background:linear-gradient(140deg,#c07828,#f2cc82 38%,#a85520 72%,#5c2e0e);
  box-shadow:0 12px 36px rgba(0,0,0,.58),inset 0 0 0 3px rgba(38,12,2,.45),inset 0 0 0 14px rgba(226,178,104,.14);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:22px;
  animation:ttl-float 4s ease-in-out 0.8s infinite}
.ttl-wordmark{
  font-size:clamp(26px,7.8vw,40px);font-weight:900;
  letter-spacing:7px;text-indent:7px;
  color:#f5d478;
  text-shadow:0 2px 0 rgba(78,26,0,.9),0 5px 18px rgba(0,0,0,.55),0 0 60px rgba(255,185,55,.2);
  line-height:1;margin-bottom:4px}
.ttl-wordmark-sub{
  font-size:clamp(14px,4vw,22px);font-weight:800;
  letter-spacing:10px;text-indent:10px;
  color:rgba(245,205,130,.72);
  text-shadow:0 1px 0 rgba(78,26,0,.7),0 3px 12px rgba(0,0,0,.4);
  margin-bottom:10px}
.ttl-tagline{
  font-size:10px;font-weight:700;letter-spacing:3px;text-indent:3px;
  color:rgba(245,205,100,.55);margin-bottom:10px;text-transform:uppercase}
.ttl-jp{
  font-size:clamp(15px,4.2vw,19px);font-weight:700;
  color:rgba(255,244,210,.9);letter-spacing:1.5px;line-height:1.7;
  text-shadow:0 2px 10px rgba(0,0,0,.48);margin-bottom:16px}
.ttl-stages{
  display:inline-flex;align-items:center;gap:8px;
  padding:4px 16px;border-radius:999px;
  border:1px solid rgba(245,210,115,.28);
  color:rgba(245,210,115,.65);
  font-size:11px;font-weight:700;letter-spacing:2px;text-indent:2px;
  margin-bottom:32px}
.ttl-stages::before,.ttl-stages::after{content:'──';opacity:.38;font-size:8px}
.ttl-btn{
  width:100%;max-width:280px;
  border:none;border-radius:16px;cursor:pointer;
  font-family:inherit;font-weight:900;letter-spacing:1.5px;
  transition:transform .12s,box-shadow .12s}
.ttl-btn:active{transform:translateY(4px)!important}
.ttl-btn-start{
  padding:17px;font-size:17px;
  background:linear-gradient(162deg,#84ce62 0%,#3a9944 52%,#1a6028 100%);
  color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.38);
  box-shadow:0 6px 0 #0f4018,0 10px 30px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.3);
  margin-bottom:13px;
  animation:ttl-glow 2.6s ease-in-out 1.8s infinite}
.ttl-btn-start:active{
  box-shadow:0 2px 0 #0f4018,0 4px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.3)!important;

<script>
'use strict';

// ══════════════════════════════════════════════════════════════════
// §1. 定数定義
// ══════════════════════════════════════════════════════════════════

/** キャンバスサイズ */
const CANVAS_W = 600;
const CANVAS_H = 600;

/** 外枠マージン（盤面端からプレイ領域端まで） */
const MARGIN = 34;

/** プレイ可能領域 */
const PLAY = {
  x: MARGIN,
  y: MARGIN,
  w: CANVAS_W - MARGIN * 2,   // 532
  h: CANVAS_H - MARGIN * 2    // 532
};

/** ビー玉半径 */
const BALL_R = 9.5;

/** レール厚み */
const RAIL_T = 12;

/** 穴デフォルト半径 */
const HOLE_R = 12;

/** ゴール判定半径 */
const GOAL_R = 20;

/** 穴の吸引開始半径倍率（穴半径×この値で吸引開始） */
const PULL_RADIUS_MULT = 2.2;

/** 総ステージ数 */
const TOTAL_STAGES = 40;

// ─── 物理定数 ───
const GRAVITY      = 0.20;   // 傾きによる加速度係数
const FRICTION     = 0.982;  // 通常摩擦係数（毎フレーム速度に乗算）
const MAX_SPEED    = 8.0;    // 最大速度(px/frame)
const OUTER_BOUNCE = 0.38;   // 外枠反発係数
const RAIL_BOUNCE  = 0.32;   // レール反発係数
const HOLE_PULL    = 0.22;   // 穴吸引力（強化: 縁で引き込まれやすく）
const ESCAPE_SPD   = 4.5;    // 穴中心付近から脱出できる速度閾値
const SINK_SPD     = 0.030;  // 穴沈下演出の進行速度

// ─── 加速/減速パネル定数 ───
const BOOST_MUL    = 1.055;  // 加速パネル倍率（毎フレーム）
const SLOW_MUL     = 0.900;  // 減速パネル倍率（毎フレーム）
const BOOST_MAX    = 10.0;   // 加速パネル通過時の最大速度

/** 加速/減速パネル生成ヘルパー */
const panel = (x, y, w, h, type) => ({ x, y, w, h, type }); // type: 'boost'|'slow'

// ─── ゲーム状態 ───
const S = Object.freeze({
  READY:     'ready',
  PLAYING:   'playing',
  SINKING:   'sinking',
  FAILED:    'failed',
  CLEARED:   'cleared',
  ALL_CLEAR: 'all_clear'
});

// ══════════════════════════════════════════════════════════════════
// §2. ユーティリティ関数
// ══════════════════════════════════════════════════════════════════

/** 値を[lo,hi]にクランプする */
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

/** 線形補間 */
const lerp  = (a, b, t) => a + (b - a) * t;

/** 2点間距離 */
const dist  = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

/** 2点間距離の二乗（比較用・sqrt回避） */
const dist2 = (ax, ay, bx, by) => (ax-bx)**2 + (ay-by)**2;

// ══════════════════════════════════════════════════════════════════
// §3. シード付き乱数（装飾用）
// ══════════════════════════════════════════════════════════════════

class SeededRandom {
  constructor(seed) {
    // xorshiftで初期化する
    this.s = (seed ^ 0x9e3779b9) >>> 0;
  }
  next() {
    this.s = (Math.imul(this.s, 1664525) + 1013904223) >>> 0;
    return this.s / 0x100000000;
  }
  range(lo, hi) { return lo + this.next() * (hi - lo); }
  int(lo, hi)   { return lo + Math.floor(this.next() * (hi - lo)); }
}

// ══════════════════════════════════════════════════════════════════
// §4. ステージデータ定義（全10ステージ）
// ══════════════════════════════════════════════════════════════════
// 座標系: Canvas左上が原点, 右方向がX正, 下方向がY正
// プレイ領域: x=34〜566, y=34〜566 (532×532)
// ─── ヘルパー関数 ───

/** 水平レール生成 x1:左端, x2:右端, y:上端 */
const hr = (x1, x2, y) => ({ x: x1, y: y,   w: x2 - x1, h: RAIL_T });
/** 垂直レール生成 y1:上端, y2:下端, x:左端 */
const vr = (y1, y2, x) => ({ x: x,  y: y1,  w: RAIL_T,  h: y2 - y1 });
/** 穴生成 */
const holeAt = (x, y, r) => ({ x, y, r: r || HOLE_R });
/** 移動穴ヘルパー: x0/y0=初期位置, axis=移動軸('x'|'y'), range=振れ幅(px), speed=周期(cycles/sec), phase=初期位相(0-1) */
const movingHole = (x0, y0, axis, range, speed, phase = 0) =>
  ({ x0, y0, x: x0, y: y0, r: HOLE_R, axis, range, speed, phase, moving: true });
/** 脈動穴ヘルパー: x/y=固定位置, minR/maxR=最小/最大半径, speed=周期(cycles/sec), phase=初期位相(0-1) */
const pulsingHole = (x, y, minR, maxR, speed, phase = 0) =>
  ({ x0: x, y0: y, x, y, r: minR, minR, maxR, axis: 'x', range: 0, speed, phase, moving: true, pulsing: true });
/** バネギミックヘルパー: 当たると玉を弾き返す移動障害物 */
const springBumper = (x0, y0, axis, range, speed, phase = 0) =>
  ({ x0, y0, x: x0, y: y0, r: 13, axis, range, speed, phase, hitTime: -999 });
/** 円軌道穴ヘルパー: cx/cy=中心, orbitR=軌道半径, speed=周期(cycles/sec), phase=初期位相(0-1) */
const orbitHole = (cx, cy, orbitR, speed, phase = 0) =>
  ({ x0: cx, y0: cy, x: cx + orbitR, y: cy, r: HOLE_R,
     cx, cy, orbitR, speed, phase, moving: true, orbit: true });
/** 自由軌道穴ヘルパー: リサジュー図形で縦横無尽に動く
 *  rx/ry=振れ幅, speedX/speedY=各軸周期, phaseX/phaseY=初期位相(0-1) */
const freeHole = (x0, y0, rx, ry, speedX, speedY, phaseX = 0, phaseY = 0) =>
  ({ x0, y0, x: x0, y: y0, r: HOLE_R,
     rx, ry, speedX, speedY, phaseX, phaseY, moving: true, free: true });
/** 加速パッドヘルパー: 踏むと指定方向へ速度を付与する床ギミック
 *  dvx/dvy=踏んだ時に加算する速度ベクトル(px/frame単位) */
const boostPad = (x, y, dvx, dvy) =>
  ({ x, y, dvx, dvy, r: 15, lastHit: -999 });

// ─── 共通座標値（5仕切り・6回廊レイアウト） ───
// プレイ領域高さ532px, 12px×5仕切り=60px, 残り472px÷6=78.67px≒78px/回廊
// 実際: 6回廊×78 + 5仕切り×12 = 468+60 = 528px (4px余白で下壁内)
const D1Y = 34 + 78;          // 112  仕切り1上端
const D2Y = D1Y + RAIL_T + 78; // 202  仕切り2上端
const D3Y = D2Y + RAIL_T + 78; // 292  仕切り3上端
const D4Y = D3Y + RAIL_T + 78; // 382  仕切り4上端
const D5Y = D4Y + RAIL_T + 78; // 472  仕切り5上端

// 各回廊の中心Y座標
const CY1 = 34 + 39;          //  73  回廊1中心
const CY2 = D1Y + RAIL_T + 39; // 163  回廊2中心
const CY3 = D2Y + RAIL_T + 39; // 253  回廊3中心
const CY4 = D3Y + RAIL_T + 39; // 343  回廊4中心
const CY5 = D4Y + RAIL_T + 39; // 433  回廊5中心
const CY6 = D5Y + RAIL_T + 39; // 523  回廊6中心

// ターン通路: 左側(34〜124=90px) / 右側(476〜566=90px)
const LEFT_X  = 34;   // プレイ左端
const RIGHT_X = 566;  // プレイ右端
const GAP_L   = 90;   // 左折れ通路幅
const GAP_R   = 90;   // 右折れ通路幅
const TURN_LX = LEFT_X + GAP_L;   // 124 左折れ通路の右端
const TURN_RX = RIGHT_X - GAP_R;  // 476 右折れ通路の左端

// 蛇行型5仕切りレール（奇数仕切り=右通路残し, 偶数仕切り=左通路残し）
const SNAKE_RAILS_5 = [
  hr(LEFT_X,  TURN_RX, D1Y),   // 仕切り1: 右90px通路
  hr(TURN_LX, RIGHT_X, D2Y),   // 仕切り2: 左90px通路
  hr(LEFT_X,  TURN_RX, D3Y),   // 仕切り3: 右90px通路
  hr(TURN_LX, RIGHT_X, D4Y),   // 仕切り4: 左90px通路
  hr(LEFT_X,  TURN_RX, D5Y),   // 仕切り5: 右90px通路
];

// 蛇行型6仕切り用Y座標（7回廊・65px幅）
const E1Y = 34 + 65;
const E2Y = E1Y + RAIL_T + 65;
const E3Y = E2Y + RAIL_T + 65;
const E4Y = E3Y + RAIL_T + 65;
const E5Y = E4Y + RAIL_T + 65;
const E6Y = E5Y + RAIL_T + 65;
// 各回廊中心
const EY1 = 34 + 32;
const EY2 = E1Y + RAIL_T + 32;
const EY3 = E2Y + RAIL_T + 32;
const EY4 = E3Y + RAIL_T + 32;
const EY5 = E4Y + RAIL_T + 32;
const EY6 = E5Y + RAIL_T + 32;
const EY7 = E6Y + RAIL_T + 32;

// 6仕切りレール（左右ターン通路=75px）
const GAP6 = 75;
const TL6  = LEFT_X  + GAP6;   // 109
const TR6  = RIGHT_X - GAP6;   // 491
const SNAKE_RAILS_6 = [
  hr(LEFT_X, TR6, E1Y),
  hr(TL6, RIGHT_X, E2Y),
  hr(LEFT_X, TR6, E3Y),
  hr(TL6, RIGHT_X, E4Y),
  hr(LEFT_X, TR6, E5Y),
  hr(TL6, RIGHT_X, E6Y),
];

// ─── ガイドパス生成ヘルパー ───
/** 5仕切り蛇行ガイドパスを生成する */
function makeSnakeGuide5(sx, sy, gx, gy) {
  return [
    {x:sx, y:CY1},
    {x:TURN_RX-5, y:CY1}, {x:RIGHT_X-5, y:(CY1+CY2)/2}, {x:RIGHT_X-5, y:CY2},
    {x:TURN_LX+5, y:CY2}, {x:LEFT_X+5,  y:(CY2+CY3)/2}, {x:LEFT_X+5,  y:CY3},
    {x:TURN_RX-5, y:CY3}, {x:RIGHT_X-5, y:(CY3+CY4)/2}, {x:RIGHT_X-5, y:CY4},
    {x:TURN_LX+5, y:CY4}, {x:LEFT_X+5,  y:(CY4+CY5)/2}, {x:LEFT_X+5,  y:CY5},
    {x:TURN_RX-5, y:CY5}, {x:RIGHT_X-5, y:(CY5+CY6)/2}, {x:gx,        y:gy},
  ];
}
/** 6仕切り蛇行ガイドパスを生成する */
function makeSnakeGuide6(sx, sy, gx, gy) {
  return [
    {x:sx,        y:EY1},
    {x:TR6-5,     y:EY1}, {x:RIGHT_X-5, y:(EY1+EY2)/2}, {x:RIGHT_X-5, y:EY2},
    {x:TL6+5,     y:EY2}, {x:LEFT_X+5,  y:(EY2+EY3)/2}, {x:LEFT_X+5,  y:EY3},
    {x:TR6-5,     y:EY3}, {x:RIGHT_X-5, y:(EY3+EY4)/2}, {x:RIGHT_X-5, y:EY4},
    {x:TL6+5,     y:EY4}, {x:LEFT_X+5,  y:(EY4+EY5)/2}, {x:LEFT_X+5,  y:EY5},
    {x:TR6-5,     y:EY5}, {x:RIGHT_X-5, y:(EY5+EY6)/2}, {x:RIGHT_X-5, y:EY6},
    {x:TL6+5,     y:EY6}, {x:LEFT_X+5,  y:(EY6+EY7)/2}, {x:gx,        y:gy},
  ];
}

// ── 5仕切りレイアウト 回廊Y境界（スタブ計算用） ──
// 回廊n(0-indexed)の上端・下端
const C5_TOP = [PLAY.y, D1Y+RAIL_T, D2Y+RAIL_T, D3Y+RAIL_T, D4Y+RAIL_T, D5Y+RAIL_T];
const C5_BOT = [D1Y,    D2Y,        D3Y,         D4Y,         D5Y,         PLAY.y+PLAY.h];
// 上部スタブ（上端から伸びる、H≤51で下部 ≥27px確保）
const stubT5 = (n,h,x) => vr(C5_TOP[n], C5_TOP[n]+Math.min(h,51), x);
// 下部スタブ（下端から伸びる、H≤51で上部 ≥27px確保）
const stubB5 = (n,h,x) => vr(C5_BOT[n]-Math.min(h,51), C5_BOT[n], x);

// 6仕切りレイアウト 回廊Y境界
const C6_TOP = [PLAY.y, E1Y+RAIL_T, E2Y+RAIL_T, E3Y+RAIL_T, E4Y+RAIL_T, E5Y+RAIL_T, E6Y+RAIL_T];
const C6_BOT = [E1Y,    E2Y,        E3Y,         E4Y,         E5Y,         E6Y,         PLAY.y+PLAY.h];
// 上部スタブ（H≤38で下部 ≥27px確保）

// ══════════════════════════════════════════════════════════════════

const runtime = {
  status:         S.READY,
  stageIndex:     0,           // 0-based インデックス
  stage:          null,        // 現在ステージデータ
  startedAt:      null,        // プレイ開始時刻
  elapsedSec:     0,           // 経過秒数
  lastFrameTime:  0,           // 前フレームのタイムスタンプ
  sinkHole:       null,        // 落下中の穴参照
  debugMode:      false,
  darknessOff:    false,       // 開発用: Fキーで暗闇ON/OFF切替
  result:         null,        // { stars, sec }
};

/** ビー玉オブジェクト */
const ball = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  r: BALL_R,
  sinkProgress: 0,   // 沈下演出 0→1
  rotation: 0,       // 転がり表現用
};

// ══════════════════════════════════════════════════════════════════
// §7. 入力管理
// ══════════════════════════════════════════════════════════════════

const input = {
  tiltX: 0,          // 最終傾き X（-1〜1）
  tiltY: 0,          // 最終傾き Y（-1〜1）
  keyX:  0,          // キーボード由来 X
  keyY:  0,          // キーボード由来 Y
  ptrX:  0,          // ポインタ由来 X（スワイプ・絶対位置共用）
  ptrY:  0,          // ポインタ由来 Y
  ptrOn: false,      // ポインタ操作中フラグ
  gyroX: 0,          // ジャイロ由来 X
  gyroY: 0,          // ジャイロ由来 Y
  gyroActive: false, // ジャイロ使用中フラグ
  dpadX: 0,          // Dパッド由来 X
  dpadY: 0,          // Dパッド由来 Y
  joystickX: 0,      // 360°ジョイスティック由来 X（-1〜1）
  joystickY: 0,      // 360°ジョイスティック由来 Y（-1〜1）
  keys:  new Set(),  // 押下中キー集合
};

/** 操作モード: 'swipe' | 'dpad' | 'gyro' */
let controlMode = localStorage.getItem('controlMode') || 'swipe';

// ── クリア済みステージ管理 ──
const clearedStages = new Set(
  JSON.parse(localStorage.getItem('clearedStages') || '[]')
);
function markStageCleared(index) {
  clearedStages.add(index);
  localStorage.setItem('clearedStages', JSON.stringify([...clearedStages]));
}
function isStageUnlocked(index) {
  return index === 0 || clearedStages.has(index - 1);
}

// ── SFX音量 ──
let sfxVolume = Number(localStorage.getItem('sfxVolume') ?? 7) / 10;

// ══════════════════════════════════════════════════════════════════
// §AdMob 広告ブリッジ（Android TWA 経由の JavascriptInterface）
// ══════════════════════════════════════════════════════════════════
// Android 側が window.AndroidAdMob を注入したときだけ広告を制御する。
// ブラウザ・PWA 環境では全関数がノーオペになる。

/**
 * バナー広告の余白を確保する。
 * Android TWA 側の bannerHeight（px）に合わせて CSS 変数と要素高さを更新する。
 * Android 側から呼び出し: window.labyrinthSetBannerHeight(60)
 */
window.labyrinthSetBannerHeight = function(px) {
  const el = document.getElementById('admob-banner-space');
  if (el) el.style.height = px + 'px';
};

/**
 * インタースティシャル広告カウンター
 * 1プレイ終了（クリア or 失敗）でカウントアップ。
 * リスタートはカウントしない。
 * 5回目以降で広告を要求。表示成功時にカウントをリセット。
 */
let _adPlayEndCount = 0;

function onPlayEnd() {
  _adPlayEndCount++;
  if (_adPlayEndCount < 5) return;
  // AndroidAdMob インターフェースが存在する場合のみ広告表示を試みる
  const bridge = window.AndroidAdMob;
  if (!bridge) return;
  try {
    const shown = bridge.showInterstitial();
    if (shown) {
      _adPlayEndCount = 0;
      // 次の広告を事前読み込み
      if (bridge.preloadInterstitial) bridge.preloadInterstitial();
    }
    // 表示できなかった（未読み込み）場合はカウントを維持
  } catch (err) {
    // ブリッジエラーは無視してゲーム進行を優先
  }
}

/** スワイプ操作の基準点 */
let _swipeStartX = 0, _swipeStartY = 0;
/** スワイプ最大距離（px）→ 傾き±1 */
const SWIPE_PIXELS = 90;

/** Dパッドの押下状態 */
const _dpad = { up: false, down: false, left: false, right: false };

/** Dパッド押下状態を input.dpadX/Y に反映する */
function _syncDpad() {
  input.dpadX = (_dpad.right ? 1 : 0) - (_dpad.left ? 1 : 0);
  input.dpadY = (_dpad.down  ? 1 : 0) - (_dpad.up   ? 1 : 0);
}

let sensitivity = 5; // 感度スライダー値（1〜10）

/** キー押下時に入力状態を更新する */
function onKeyDown(e) {
  input.keys.add(e.code);
  // ゲームプレイ以外でのスペース/エンターはオーバーレイ操作に使う
  if (e.code === 'KeyR') { restartStage(); }
  if (e.code === 'KeyF') { runtime.darknessOff = !runtime.darknessOff; } // 暗闇トグル
  if (['Space','Enter'].includes(e.code) && runtime.status === S.CLEARED) { goNextStage(); }
  // ページスクロール抑制
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
    e.preventDefault();
  }
}
/** キー離上時に入力状態を更新する */
function onKeyUp(e) { input.keys.delete(e.code); }

/** キー押下状態からキーボード傾き値を算出する */
function updateKeyboardInput() {
  let kx = 0, ky = 0;
  if (input.keys.has('ArrowLeft')  || input.keys.has('KeyA')) kx -= 1;
  if (input.keys.has('ArrowRight') || input.keys.has('KeyD')) kx += 1;
  if (input.keys.has('ArrowUp')    || input.keys.has('KeyW')) ky -= 1;
  if (input.keys.has('ArrowDown')  || input.keys.has('KeyS')) ky += 1;
  input.keyX = kx;
  input.keyY = ky;
}

/** Canvas上のポインタ座標から傾き値を算出する */
function calcPtrTilt(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  // Canvas論理座標への変換
  const scaleX = CANVAS_W / rect.width;
  const scaleY = CANVAS_H / rect.height;
  const lx = (clientX - rect.left) * scaleX;
  const ly = (clientY - rect.top)  * scaleY;
  // 中心からの距離を傾きに変換
  input.ptrX = clamp((lx - CANVAS_W / 2) / (CANVAS_W / 2), -1, 1);
  input.ptrY = clamp((ly - CANVAS_H / 2) / (CANVAS_H / 2), -1, 1);
}

function onMouseMove(e) {
  if (!input.ptrOn) return;
  calcPtrTilt(e.clientX, e.clientY);
}
function onMouseDown(e) {
  input.ptrOn = true;
  calcPtrTilt(e.clientX, e.clientY);
}
function onMouseUp()   { input.ptrOn = false; input.ptrX = 0; input.ptrY = 0; }
function onMouseLeave(){ input.ptrOn = false; input.ptrX = 0; input.ptrY = 0; }

function onTouchStart(e) {
  e.preventDefault();
  if (controlMode === 'dpad') return; // Dパッドが独自に処理
  const t = e.touches[0];
  if (controlMode === 'swipe') {
    _swipeStartX = t.clientX;
    _swipeStartY = t.clientY;
    input.ptrOn  = true;
    input.ptrX   = 0;
    input.ptrY   = 0;
  } else {
    // 絶対位置モード（ジャイロ補助・PCマウス互換）
    input.ptrOn = true;
    calcPtrTilt(t.clientX, t.clientY);
  }
}
function onTouchMove(e) {
  e.preventDefault();
  if (controlMode === 'dpad') return;
  const t = e.touches[0];
  if (controlMode === 'swipe') {
    const dx = t.clientX - _swipeStartX;
    const dy = t.clientY - _swipeStartY;
    input.ptrX = clamp(dx / SWIPE_PIXELS, -1, 1);
    input.ptrY = clamp(dy / SWIPE_PIXELS, -1, 1);
  } else {
    calcPtrTilt(t.clientX, t.clientY);
  }
}
function onTouchEnd(e) {
  e.preventDefault();
  if (e.touches.length === 0) {
    input.ptrOn = false;
    input.ptrX  = 0;
    input.ptrY  = 0;
  }
}

/** 端末傾きイベントからジャイロ傾き値を算出する（iOS/Android対応） */
function onDeviceOrientation(e) {
  if (!input.gyroActive) return;
  const maxTilt = 22;
  input.gyroX = clamp((e.gamma || 0) / maxTilt, -1, 1);
  // beta=0が水平。端末を約45°前傾けた状態を基準にする
  input.gyroY = clamp(((e.beta || 45) - 45) / maxTilt, -1, 1);
}

/** 全入力ソースを統合して最終傾き値を算出する */
function integrateInput() {
  updateKeyboardInput();
  // 感度スケール: スライダー値(1-10) → 係数(0.4〜1.0)
  const sens = 0.4 + (sensitivity - 1) * (0.6 / 9);
  let targetX, targetY;
  if (controlMode === 'gyro' && input.gyroActive) {
    // ジャイロ（キー補助）
    targetX = input.gyroX + input.keyX * 0.1;
    targetY = input.gyroY + input.keyY * 0.1;
  } else if (controlMode === 'dpad') {
    // Dパッド（キー補助）
    targetX = input.dpadX + input.keyX * 0.15;
    targetY = input.dpadY + input.keyY * 0.15;
  } else if (controlMode === 'joystick') {
    // 360°アナログジョイスティック（キー補助）
    targetX = input.joystickX + input.keyX * 0.1;
    targetY = input.joystickY + input.keyY * 0.1;
  } else if (input.ptrOn) {
    // スワイプ or 絶対位置（キー補助）
    targetX = input.ptrX + input.keyX * 0.15;
    targetY = input.ptrY + input.keyY * 0.15;
  } else {
    // キーボードのみ
    targetX = input.keyX;
    targetY = input.keyY;
  }
  targetX = clamp(targetX, -1, 1) * sens;
  targetY = clamp(targetY, -1, 1) * sens;
  // スムージング（急激な切り替えを抑制）
  input.tiltX = lerp(input.tiltX, targetX, 0.18);
  input.tiltY = lerp(input.tiltY, targetY, 0.18);
}

/** ジャイロパーミッションを取得して input.gyroActive を有効化する */
async function requestGyroPermission() {
  if (typeof DeviceOrientationEvent === 'undefined') return false;
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const perm = await DeviceOrientationEvent.requestPermission();
      if (perm !== 'granted') {
        setMessage('ジャイロのアクセスを許可してください');
        return false;
      }
    } catch (e) { return false; }
  }
  window.addEventListener('deviceorientation', onDeviceOrientation);
  input.gyroActive = true;
  return true;
}

/** 操作モードを切替え：UI表示・ガイドテキスト・Dパッドを同期する */
function applyControlMode() {
  const dpadEl      = document.getElementById('dpad');
  const joystickEl  = document.getElementById('joystick');
  const controlArea = document.getElementById('controlArea');
  const guideEl     = document.getElementById('guide');
  // Dパッド / ジョイスティック 表示切替
  dpadEl.style.display = controlMode === 'dpad' ? 'grid' : 'none';
  if (joystickEl) joystickEl.style.display = controlMode === 'joystick' ? 'flex' : 'none';
  // コントロールエリアはパッドが表示される場合のみ高さを持つ
  if (controlArea) {
    const hasPad = controlMode === 'dpad' || controlMode === 'joystick';
    controlArea.style.padding = hasPad ? '12px 0 8px' : '0';
    controlArea.style.minHeight = hasPad ? '' : '0';
  }
  // ガイドテキスト更新
  const kbdHint = '<kbd>↑↓←→</kbd> キー &nbsp;|&nbsp; <kbd>R</kbd>：リスタート';
  if (controlMode === 'swipe') {
    guideEl.innerHTML = '👆 ドラッグで操作 &nbsp;|&nbsp; ' + kbdHint;
  } else if (controlMode === 'dpad') {
    guideEl.innerHTML = '🕹 Dパッドで操作 &nbsp;|&nbsp; ' + kbdHint;
  } else if (controlMode === 'joystick') {
    guideEl.innerHTML = '🔘 360°パッドで操作 &nbsp;|&nbsp; ' + kbdHint;
  } else {
    guideEl.innerHTML = '📱 ジャイロで操作 &nbsp;|&nbsp; ' + kbdHint;
  }
  // 設定モーダルのラジオボタン・ハイライト同期
  const radio = document.querySelector(`input[name="ctrlMode"][value="${controlMode}"]`);
  if (radio) radio.checked = true;
  document.querySelectorAll('.cmo').forEach(el => {
    const v = el.querySelector('input[type=radio]').value;
    el.classList.toggle('selected', v === controlMode);
  });
  // ドロワー内 ctm-btn ハイライト同期
  document.querySelectorAll('.ctm-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === controlMode);
  });
}

// ══════════════════════════════════════════════════════════════════
// §8. ステージ管理
// ══════════════════════════════════════════════════════════════════

/** 指定インデックスのステージを読み込む */
function loadStage(index) {
  runtime.stageIndex = index;
  runtime.stage = STAGE_DEFS[index];
  runtime.status    = S.READY;
  runtime.startedAt = null;
  runtime.elapsedSec = 0;
  runtime.sinkHole  = null;
  runtime.result    = null;
  // 移動穴: stageのmovingHoles定義からliveオブジェクトを複製生成
  runtime.movingHoles = runtime.stage.movingHoles
    ? runtime.stage.movingHoles.map(h => Object.assign({}, h))
    : [];
  // バネ: stageのspringBumpers定義からliveオブジェクトを複製生成
  runtime.springBumpers = runtime.stage.springBumpers
    ? runtime.stage.springBumpers.map(b => Object.assign({}, b))
    : [];
  // 加速パッド: stageのboostPads定義からliveオブジェクトを複製生成
  runtime.boostPads = runtime.stage.boostPads
    ? runtime.stage.boostPads.map(p => Object.assign({}, p))
    : [];
  // ビー玉をスタート地点に配置
  resetBall();
  // UI更新
  updateHUD();
  hideOverlay();
  nextBtn.disabled = true;
  setMessage('最初に少し傾けるとタイマーが始まります。');
}

/** ビー玉をスタート位置に戻す */
function resetBall() {
  const st = runtime.stage.start;
  ball.x = st.x;
  ball.y = st.y;
  ball.vx = 0;
  ball.vy = 0;
  ball.sinkProgress = 0;
  ball.rotation = 0;
}

/** 現在ステージをリスタートする */
function restartStage() {
  if (runtime.status === S.SINKING) return; // 演出中はリスタート不可
  loadStage(runtime.stageIndex);
}

/** 次のステージへ進む */
function goNextStage() {
  const next = runtime.stageIndex + 1;
  if (next >= TOTAL_STAGES) {
    // 全ステージクリア
    showAllClear();
  } else {
    loadStage(next);
  }
}

/** 最初のステージに戻る */
function resetToFirst() {
  loadStage(0);
}

// ══════════════════════════════════════════════════════════════════
// §9. 物理演算
// ══════════════════════════════════════════════════════════════════

/**
 * 物理演算の1ステップを実行する
 * 呼び出し順: 加速度 → 摩擦 → 穴吸引 → 速度制限 → 位置更新 → 外枠判定 → レール判定
 */
function updatePhysics() {
  applyAcceleration();
  applyFriction();
  applyHolePull();
  applySpeedPanels();   // 加速/減速パネルを物理ループ内で適用
  limitSpeed();
  moveBall();
  resolveOuterWall();
  resolveAllRails();
}

/** 傾きから加速度を適用する */
function applyAcceleration() {
  ball.vx += input.tiltX * GRAVITY;
  ball.vy += input.tiltY * GRAVITY;
}

/** 摩擦を適用する（毎フレーム速度を減衰）。ステージ固有の摩擦係数があれば優先する */
function applyFriction() {
  const fr = runtime.stage?.physics?.friction ?? FRICTION;
  ball.vx *= fr;
  ball.vy *= fr;
}

/** すべての穴の吸引力を適用する */
function applyHolePull() {
  const stage = runtime.stage;
  for (const hole of stage.holes) {
    const pullR = hole.r * PULL_RADIUS_MULT;
    const dx = hole.x - ball.x;
    const dy = hole.y - ball.y;
    const d = Math.hypot(dx, dy);
    if (d < pullR && d > 0) {
      // 距離に応じた吸引力（近いほど強い）
      const strength = (1 - d / pullR) ** 2 * HOLE_PULL;
      ball.vx += (dx / d) * strength;
      ball.vy += (dy / d) * strength;
    }
  }
}

/** 加速/減速パネルを適用する */
function applySpeedPanels() {
  const panels = runtime.stage.panels;
  if (!panels || panels.length === 0) return;
  for (const p of panels) {
    if (ball.x >= p.x && ball.x <= p.x + p.w &&
        ball.y >= p.y && ball.y <= p.y + p.h) {
      if (p.type === 'boost') {
        ball.vx *= BOOST_MUL;
        ball.vy *= BOOST_MUL;
      } else {
        ball.vx *= SLOW_MUL;
        ball.vy *= SLOW_MUL;
      }
    }
  }
}

/** 速度を最大値以内に制限する */
function limitSpeed() {
  const spd = Math.hypot(ball.vx, ball.vy);
  if (spd > MAX_SPEED) {
    const scale = MAX_SPEED / spd;
    ball.vx *= scale;
    ball.vy *= scale;
  }
}

/** ビー玉座標を速度で更新する */
function moveBall() {
  ball.x += ball.vx;
  ball.y += ball.vy;
  // 転がり表現用回転角を更新
  ball.rotation += Math.hypot(ball.vx, ball.vy) * 0.08;
}

/** 外枠との衝突を解決する */
function resolveOuterWall() {
  const left   = PLAY.x + ball.r;
  const right  = PLAY.x + PLAY.w - ball.r;
  const top    = PLAY.y + ball.r;
  const bottom = PLAY.y + PLAY.h - ball.r;

  if (ball.x < left)  { ball.x = left;   ball.vx =  Math.abs(ball.vx) * OUTER_BOUNCE; playBump(ball.vy); }
  if (ball.x > right) { ball.x = right;  ball.vx = -Math.abs(ball.vx) * OUTER_BOUNCE; playBump(ball.vy); }
  if (ball.y < top)   { ball.y = top;    ball.vy =  Math.abs(ball.vy) * OUTER_BOUNCE; playBump(ball.vx); }
  if (ball.y > bottom){ ball.y = bottom; ball.vy = -Math.abs(ball.vy) * OUTER_BOUNCE; playBump(ball.vx); }
}

/** 全レールとの衝突を解決する */
function resolveAllRails() {
  for (const rail of runtime.stage.rails) {
    resolveRailCollision(rail);
  }
}

/**
 * ビー玉とAABBレールの衝突解決（円-矩形衝突）
 * 1. レール上の最近点を求める
 * 2. めり込み量を計算する
 * 3. 法線方向にビー玉を押し戻す
 * 4. 法線方向の速度成分を反転・減衰する
 */
function resolveRailCollision(rail) {
  // ビー玉中心に最近いレール上の点を求める
  const nearX = clamp(ball.x, rail.x, rail.x + rail.w);
  const nearY = clamp(ball.y, rail.y, rail.y + rail.h);
  const dx = ball.x - nearX;
  const dy = ball.y - nearY;
  const d2 = dx * dx + dy * dy;

  if (d2 >= ball.r * ball.r) return; // 衝突なし

  const d = Math.sqrt(d2) || 0.001;
  const nx = dx / d;
  const ny = dy / d;
  const overlap = ball.r - d;

  // めり込み補正
  ball.x += nx * overlap;
  ball.y += ny * overlap;

  // 法線方向の速度成分を計算
  const velN = ball.vx * nx + ball.vy * ny;
  if (velN < 0) {
    // 接近中のみ反射する（離れる方向なら無視）
    const isSpringWall = runtime.stage?.physics?.springWalls;
    const bounce = isSpringWall ? 0.85 : RAIL_BOUNCE;
    ball.vx -= velN * nx * (1 + bounce);
    ball.vy -= velN * ny * (1 + bounce);
    // 接線方向摩擦（氷は壁沿い滑り、バネ壁は接線保持、通常は減衰）
    const wf = isSpringWall ? 0.998
             : (runtime.stage?.physics?.wallFriction ?? 0.92);
    ball.vx *= wf;
    ball.vy *= wf;
    playBump(velN);
  }
}

// ══════════════════════════════════════════════════════════════════
// §10. 衝突判定（ゲーム進行に関わる判定）
// ══════════════════════════════════════════════════════════════════

/**
 * 穴落下判定（改善版）
 * - 深部判定: 中心付近ならESCAPE_SPD以下で必ず落下
 * - 縁判定:   穴の縁に差し掛かった場合も速度が閾値以下なら落下
 * - Swept判定: 高速時に前フレームの軌跡上で穴を通過したかチェック
 */
function checkHoleFall() {
  const spd = Math.hypot(ball.vx, ball.vy);
  // 固定穴＋移動穴を結合して一括判定
  const allHoles = runtime.stage.holes.concat(runtime.movingHoles || []);

  // ── 通常判定（現在位置） ──
  for (const hole of allHoles) {
    const d = dist(ball.x, ball.y, hole.x, hole.y);
    // 深部: 穴半径の65%以内 → 速度に関わらず落下
    if (d < hole.r * 0.65) {
      startSinking(hole);
      return true;
    }
    // 縁: 穴半径の110%以内 → ESCAPE_SPD以下なら落下（縁をかすれば落ちる）
    if (d < hole.r * 1.10 && spd <= ESCAPE_SPD) {
      startSinking(hole);
      return true;
    }
  }

  // ── Swept判定（高速時の前フレーム軌跡チェック） ──
  if (spd >= 2.5) {
    const steps = Math.min(Math.ceil(spd / 2.0), 6); // 最大6サブステップ
    for (const hole of allHoles) {
      for (let s = 1; s < steps; s++) {
        const t = s / steps;
        // 今フレームの移動軌跡上の中間点
        const px = ball.x - ball.vx * (1 - t);
        const py = ball.y - ball.vy * (1 - t);
        const d = dist(px, py, hole.x, hole.y);
        if (d < hole.r * 0.85) {
          // 穴中心へ吸い込む
          ball.x  = hole.x;
          ball.y  = hole.y;
          ball.vx = 0;
          ball.vy = 0;
          startSinking(hole);
          return true;
        }
      }
    }
  }
  return false;
}

/** ゴール到達判定: ビー玉中心がゴール円内に入ったらクリア */
function checkGoal() {
  const g = runtime.stage.goal;
  const d = dist(ball.x, ball.y, g.x, g.y);
  return d < GOAL_R;
}

/** 穴への落下演出を開始する */
function startSinking(hole) {
  runtime.status   = S.SINKING;
  runtime.sinkHole = hole;
  ball.vx = 0;
  ball.vy = 0;
  ball.sinkProgress = 0;
  playFall();
}

/** 穴沈下演出を1フレーム進める */
function updateSinking() {
  ball.sinkProgress += SINK_SPD;
  // 穴の中心へ引き寄せる
  ball.x = lerp(ball.x, runtime.sinkHole.x, 0.12);
  ball.y = lerp(ball.y, runtime.sinkHole.y, 0.12);
  if (ball.sinkProgress >= 1.0) {
    ball.sinkProgress = 1.0;
    runtime.status = S.FAILED;
    showFailOverlay();
  }
}

/**
 * クリアタイムから星数を算出する（純粋関数）
 * @param {number} sec - クリアタイム（秒）
 * @param {{three:number,two:number,one:number}} times - 基準タイム
 * @returns {number} 星数 3/2/1
 */
function evaluateStars(sec, times) {
  if (sec <= times.three) return 3;
  if (sec <= times.two)   return 2;
  return 1;
}

/** 星数からプレーンテキストを返す（メッセージ用） */
function starsToPlain(n) {
  return '★'.repeat(n) + '☆'.repeat(3 - n);
}

/** 星数からHTML文字列を返す（色付き表示用）
 *  オーバーレイ用: class="star-gold"/"star-empty"
 *  HUD用: class="star-hud-gold"/"star-hud-empty"
 */
function starsToHTML(n, hud = false) {
  const gc = hud ? 'star-hud-gold'  : 'star-gold';
  const ec = hud ? 'star-hud-empty' : 'star-empty';
  return '<span class="' + gc + '">' + '★'.repeat(n)     + '</span>' +
         '<span class="' + ec + '">' + '☆'.repeat(3 - n) + '</span>';
}

/** 後方互換: textContent用のプレーンテキスト（旧コード向け） */
function starsToStr(n) { return starsToPlain(n); }

// 木目テクスチャをオフスクリーンCanvasに事前描画する（毎フレーム再生成を避ける）
const woodCanvas = document.createElement('canvas');
woodCanvas.width  = CANVAS_W;
woodCanvas.height = CANVAS_H;
(function initWoodTexture() {
  const wc = woodCanvas.getContext('2d');
  const rng = new SeededRandom(42);
  // 基本グラデーション
  const grad = wc.createLinearGradient(0, 0, CANVAS_W * 0.3, CANVAS_H);
  grad.addColorStop(0,   '#e2c07a');
  grad.addColorStop(0.3, '#d4b066');
  grad.addColorStop(0.7, '#d8b870');
  grad.addColorStop(1,   '#c8a862');
  wc.fillStyle = grad;
  wc.fillRect(0, 0, CANVAS_W, CANVAS_H);
  // 木目線（細い曲線を多数描く）
  for (let i = 0; i < 90; i++) {
    const y0   = rng.range(-CANVAS_H * 0.2, CANVAS_H * 1.2);
    const amp  = rng.range(2, 10);
    const freq = rng.range(0.003, 0.009);
    const al   = rng.range(0.02, 0.07);
    const lw   = rng.range(0.4, 1.1);
    wc.beginPath();
    wc.moveTo(0, y0);
    for (let x = 0; x <= CANVAS_W; x += 4) {
      wc.lineTo(x, y0 + Math.sin(x * freq + i * 0.7) * amp);
    }
    wc.strokeStyle = `rgba(90,50,10,${al})`;
    wc.lineWidth = lw;
    wc.stroke();
  }
})();

// 氷テクスチャをオフスクリーンCanvasに事前描画する
const iceCanvas = document.createElement('canvas');
iceCanvas.width  = CANVAS_W;
iceCanvas.height = CANVAS_H;
(function initIceTexture() {
  const ic  = iceCanvas.getContext('2d');
  const rng = new SeededRandom(77);
  // 氷の基本グラデーション（白〜淡い水色）
  const base = ic.createLinearGradient(0, 0, CANVAS_W, CANVAS_H);
  base.addColorStop(0,    '#eaf6fc');
  base.addColorStop(0.25, '#d4eef8');
  base.addColorStop(0.5,  '#e2f4fb');
  base.addColorStop(0.75, '#c8eaf5');
  base.addColorStop(1,    '#dcf2fb');
  ic.fillStyle = base;
  ic.fillRect(0, 0, CANVAS_W, CANVAS_H);
  // 光沢ライン（氷面の微細な反射）
  for (let i = 0; i < 55; i++) {
    const y0 = rng.range(-CANVAS_H * 0.1, CANVAS_H * 1.1);
    const al = rng.range(0.04, 0.16);
    ic.beginPath();
    ic.moveTo(0, y0);
    for (let x = 0; x <= CANVAS_W; x += 6) {
      ic.lineTo(x, y0 + Math.sin(x * rng.range(0.006, 0.018) + i * 1.4) * rng.range(1, 5));
    }
    ic.strokeStyle = `rgba(255,255,255,${al})`;
    ic.lineWidth   = rng.range(0.3, 1.1);
    ic.stroke();
  }
  // 氷のひび割れ（薄い亀裂模様）
  for (let i = 0; i < 22; i++) {
    const sx = rng.range(MARGIN, CANVAS_W - MARGIN);
    const sy = rng.range(MARGIN, CANVAS_H - MARGIN);
    ic.beginPath();
    ic.moveTo(sx, sy);
    let px = sx, py = sy;
    for (let j = 0; j < 5; j++) {
      px += rng.range(-35, 35);
      py += rng.range(-35, 35);
      ic.lineTo(px, py);
    }
    ic.strokeStyle = `rgba(120,185,220,${rng.range(0.15, 0.30)})`;
    ic.lineWidth   = rng.range(0.4, 0.9);
    ic.stroke();
  }
  // プレイ領域のみ薄青オーバーレイ（枠外との差別化）
  ic.fillStyle = 'rgba(160,220,245,0.12)';
  ic.fillRect(MARGIN, MARGIN, CANVAS_W - MARGIN * 2, CANVAS_H - MARGIN * 2);
})();

/**
 * 暗闇オーバーレイ: physics.darkness が true のステージで全画面を暗くし
 * ビー玉周辺だけを懐中電灯のように明るく表示する。
 * draw()の最後に呼び出すことで全レイヤーに掛かる。
 */
function drawDarknessOverlay() {
  if (!runtime.stage?.physics?.darkness) return;
  // 開発者トグル (Fキー): OFF中は右上に小さいバッジを表示して終了
  if (runtime.darknessOff) {
    ctx.save();
    ctx.fillStyle = 'rgba(255,80,80,0.85)';
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText('🔦 DARK: OFF  [F]', CANVAS_W - 6, 6);
    ctx.restore();
    return;
  }
  const baseR = runtime.stage.physics.darknessRadius ?? 80;
  const t = performance.now() / 1000;
  // トーチのような不規則な揺らぎ (±5px 合成)
  const R = baseR
    + Math.sin(t * 2.3) * 3
    + Math.sin(t * 5.7) * 2;
  const OUTER = 850; // キャンバス対角線より大きい値で全域を覆う

  ctx.save();
  const g = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, OUTER);
  g.addColorStop(0,                'rgba(0,0,0,0)');    // 玉の中心: 完全透明
  g.addColorStop(R / OUTER,        'rgba(0,0,0,0)');    // 可視半径まで: 透明
  g.addColorStop((R + 32) / OUTER, 'rgba(0,0,0,0.93)');// 境界 +32px: ほぼ暗
  g.addColorStop(1,                'rgba(0,0,0,0.97)'); // 端: 真っ暗
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  ctx.restore();
}

/**
 * メイン描画関数: 毎フレーム呼び出す
 * 描画順序: 背景 → 外枠 → ガイドライン → 穴 → ゴール → レール → ビー玉 → 暗闇 → デバッグ
 */
function draw() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  drawWoodBackground();
  drawOuterFrame();
  drawGuidePath();
  drawSpeedPanels();   // 加速/減速パネルを穴の前に描画
  drawBoostPads();     // 加速パッド（矢印床）
  drawSpringBumpers(); // バネ障害物
  drawHoles();
  drawGoal();
  drawRails();
  drawBall();
  drawDarknessOverlay(); // 暗闇オーバーレイ（最後: 全レイヤーの上に掛ける）
  if (runtime.debugMode) drawDebugOverlay();
}

/** 背景（木目 or 氷）を描画する */
function drawWoodBackground() {
  const isIce = runtime.stage?.physics?.ice;
  ctx.drawImage(isIce ? iceCanvas : woodCanvas, 0, 0);
  // プレイ領域に内側シャドウ効果
  const grad = ctx.createRadialGradient(300, 300, 160, 300, 300, 310);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, isIce ? 'rgba(20,60,120,0.14)' : 'rgba(50,20,0,0.18)');
  ctx.fillStyle = grad;
  ctx.fillRect(PLAY.x, PLAY.y, PLAY.w, PLAY.h);
}

/** 外枠を描画する（木製 or 氷製フレーム） */
function drawOuterFrame() {
  const isIce = runtime.stage?.physics?.ice;
  // 外枠の影
  ctx.shadowColor   = isIce ? 'rgba(0,30,80,0.40)' : 'rgba(40,15,0,0.5)';
  ctx.shadowBlur    = 16;
  ctx.shadowOffsetX = 3;
  ctx.shadowOffsetY = 4;

  // 外枠本体
  ctx.strokeStyle = isIce ? '#1a3a5c' : '#4a2208';
  ctx.lineWidth   = MARGIN * 2;
  ctx.strokeRect(MARGIN, MARGIN, PLAY.w, PLAY.h);

  ctx.shadowColor = 'transparent';
  ctx.shadowBlur  = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;

  // 内側の細い縁取り
  ctx.strokeStyle = isIce ? 'rgba(40,100,160,0.55)' : 'rgba(60,28,8,0.55)';
  ctx.lineWidth   = 2;
  ctx.strokeRect(PLAY.x - 1, PLAY.y - 1, PLAY.w + 2, PLAY.h + 2);

  // フレームのハイライト（上・左）
  ctx.strokeStyle = isIce ? 'rgba(180,230,255,0.55)' : 'rgba(220,170,90,0.45)';
  ctx.lineWidth   = 1;
  ctx.beginPath();
  ctx.moveTo(MARGIN, MARGIN);
  ctx.lineTo(CANVAS_W - MARGIN, MARGIN);
  ctx.moveTo(MARGIN, MARGIN);
  ctx.lineTo(MARGIN, CANVAS_H - MARGIN);
  ctx.stroke();

  // 盤面内縁の溝
  ctx.strokeStyle = isIce ? '#0c2040' : '#1a0c04';
  ctx.lineWidth   = 3;
  ctx.strokeRect(PLAY.x - 1, PLAY.y - 1, PLAY.w + 2, PLAY.h + 2);
  ctx.strokeStyle = isIce ? 'rgba(180,230,255,0.28)' : 'rgba(255,220,140,0.30)';
  ctx.lineWidth   = 1.5;
  ctx.strokeRect(PLAY.x + 2, PLAY.y + 2, PLAY.w - 4, PLAY.h - 4);
}

/** ガイドライン（スタート〜ゴールのルート線）を描画する */
function drawGuidePath() {
  const pts = runtime.stage.guidePath;
  if (!pts || pts.length < 2) return;
  ctx.save();
  ctx.setLineDash([6, 5]);
  ctx.strokeStyle = 'rgba(60,30,5,0.22)';
  ctx.lineWidth   = 1.5;
  ctx.lineJoin    = 'round';
  ctx.lineCap     = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    ctx.lineTo(pts[i].x, pts[i].y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

/** 加速/減速パネルを描画する（ビー玉が乗っている場合は発光強調） */
function drawSpeedPanels() {
  const panels = runtime.stage.panels;
  if (!panels || panels.length === 0) return;
  for (const p of panels) {
    ctx.save();
    const isBoost = (p.type === 'boost');
    // ビー玉がパネル上にいるか判定
    const onPanel = (ball.x >= p.x && ball.x <= p.x + p.w &&
                     ball.y >= p.y && ball.y <= p.y + p.h);
    const alpha   = onPanel ? 0.72 : (isBoost ? 0.30 : 0.24);
    const strokeA = onPanel ? 1.0  : 0.82;
    ctx.fillStyle   = isBoost ? `rgba(255,80,10,${alpha})`   : `rgba(20,70,240,${alpha})`;
    ctx.strokeStyle = isBoost ? `rgba(255,130,20,${strokeA})`: `rgba(70,120,255,${strokeA})`;
    ctx.lineWidth   = onPanel ? 2.8 : 1.8;
    if (onPanel) {
      ctx.shadowColor = isBoost ? 'rgba(255,120,0,0.9)' : 'rgba(60,120,255,0.9)';
      ctx.shadowBlur  = 16;
    }
    roundRect(ctx, p.x, p.y, p.w, p.h, 7);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // ラベル描画：大型パネルはアイコン＋日本語、小型は記号のみ
    const cx = p.x + p.w / 2;
    const cy = p.y + p.h / 2;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    if (p.h >= 32 && p.w >= 80) {
      // 大型パネル：記号と日本語を縦並びで表示
      ctx.fillStyle = isBoost ? 'rgba(255,160,50,0.97)' : 'rgba(100,160,255,0.97)';
      ctx.font = `bold ${Math.min(p.w * 0.18, 14)}px system-ui`;
      ctx.fillText(isBoost ? '▶▶ 加速' : '◀◀ 減速', cx, cy - 1);
    } else {
      ctx.fillStyle = isBoost ? 'rgba(255,140,30,0.95)' : 'rgba(80,140,255,0.95)';
      ctx.font      = `bold ${Math.min(p.w, p.h) * 0.50}px system-ui`;
      ctx.fillText(isBoost ? '▶▶' : '▐▐', cx, cy);
    }
    ctx.restore();
  }
}

/**
 * 移動穴の位置をperformance.nowの絶対時間で更新する
 * gameLoop()から毎フレーム呼び出す（READY/PLAYING問わず動作）
 */
function updateMovingHoles() {
  if (!runtime.movingHoles || runtime.movingHoles.length === 0) return;
  const t = performance.now() / 1000; // 絶対時間(秒)
  for (const h of runtime.movingHoles) {
    if (h.orbit) {
      // 円軌道: 中心(cx,cy)を中心に一定速度で回転
      const angle = t * h.speed * Math.PI * 2 + h.phase * Math.PI * 2;
      h.x = h.cx + Math.cos(angle) * h.orbitR;
      h.y = h.cy + Math.sin(angle) * h.orbitR;
    } else if (h.free) {
      // 自由軌道: x/y独立sin波によるリサジュー運動
      h.x = h.x0 + Math.sin(t * h.speedX * Math.PI * 2 + h.phaseX * Math.PI * 2) * h.rx;
      h.y = h.y0 + Math.sin(t * h.speedY * Math.PI * 2 + h.phaseY * Math.PI * 2) * h.ry;
    } else {
      // 従来の1軸sin往復運動
      const offset = Math.sin(t * h.speed * Math.PI * 2 + h.phase * Math.PI * 2) * h.range;
      h.x = h.x0 + (h.axis === 'x' ? offset : 0);
      h.y = h.y0 + (h.axis === 'y' ? offset : 0);
      // 脈動穴: 半径をsin波で拡大縮小
      if (h.pulsing) {
        const pulse = 0.5 + 0.5 * Math.sin(t * h.speed * Math.PI * 2 + h.phase * Math.PI * 2);
        h.r = h.minR + (h.maxR - h.minR) * pulse;
      }
    }
  }
}

// ══════════════════════════════════════════════════════════════════
// §バネ障害物 (Spring Bumper)
// ══════════════════════════════════════════════════════════════════

/** バネ位置を毎フレーム更新 */
function updateSpringBumpers() {
  if (!runtime.springBumpers || !runtime.springBumpers.length) return;
  const t = performance.now() / 1000;
  for (const b of runtime.springBumpers) {
    const offset = Math.sin(t * b.speed * Math.PI * 2 + b.phase * Math.PI * 2) * b.range;
    b.x = b.x0 + (b.axis === 'x' ? offset : 0);
    b.y = b.y0 + (b.axis === 'y' ? offset : 0);
  }
}

/**
 * バネ衝突判定: ビー玉がバネに当たったら弾き返す
 * 反発係数 >1 で運動エネルギーを付与し「はじかれた」感を演出
 */
function checkSpringBounce() {
  if (!runtime.springBumpers || !runtime.springBumpers.length) return;
  const RESTITUTION   = 1.40; // 反発係数 (>1 = エネルギー付加)
  const MIN_BOUNCE    = 3.0;  // 最低弾き速度 (px/frame)
  for (const b of runtime.springBumpers) {
    const dx   = ball.x - b.x;
    const dy   = ball.y - b.y;
    const dist = Math.hypot(dx, dy);
    const minD = BALL_R + b.r;
    if (dist < minD && dist > 0.001) {
      const nx = dx / dist;
      const ny = dy / dist;
      // めり込み解消
      ball.x = b.x + nx * minD;
      ball.y = b.y + ny * minD;
      // 法線方向の速度成分を計算
      const vn = ball.vx * nx + ball.vy * ny;
      if (vn < 0) { // 接近中のみ処理
        const newVn = Math.max(Math.abs(vn) * RESTITUTION, MIN_BOUNCE);
        ball.vx += (-vn + newVn) * nx;
        ball.vy += (-vn + newVn) * ny;
        b.hitTime = performance.now();
      }
    }
  }
}

/** バネを描画: 黄緑の丸に螺旋コイル模様 + ヒット時のスカッシュアニメ */
function drawSpringBumpers() {
  if (!runtime.springBumpers || !runtime.springBumpers.length) return;
  const now = performance.now();
  const t   = now / 1000;
  for (const b of runtime.springBumpers) {
    const age    = (now - b.hitTime) / 1000;
    const squish = age < 0.20
      ? 1 + 0.40 * Math.sin((age / 0.20) * Math.PI)
      : 1;

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(squish, 1 / squish);

    // 外側グロー
    const glow = ctx.createRadialGradient(0, 0, b.r - 3, 0, 0, b.r + 10);
    glow.addColorStop(0, 'rgba(160,255,30,0.45)');
    glow.addColorStop(1, 'rgba(160,255,30,0)');
    ctx.beginPath();
    ctx.arc(0, 0, b.r + 10, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    // 本体グラデーション
    const grad = ctx.createRadialGradient(-3, -4, 1, 0, 0, b.r);
    grad.addColorStop(0,   '#ecff4a');
    grad.addColorStop(0.55,'#a8d800');
    grad.addColorStop(1,   '#4e7200');
    ctx.beginPath();
    ctx.arc(0, 0, b.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(25,55,0,0.55)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 回転するコイル模様
    ctx.save();
    ctx.rotate(t * 1.5);
    ctx.strokeStyle = 'rgba(20,50,0,0.60)';
    ctx.lineWidth = 1.2;
    const SEGS = 14;
    ctx.beginPath();
    for (let i = 0; i <= SEGS; i++) {
      const angle = (i / SEGS) * Math.PI * 2;
      const r = b.r * (i % 2 === 0 ? 0.40 : 0.75);
      const cx = Math.cos(angle) * r;
      const cy = Math.sin(angle) * r;
      i === 0 ? ctx.moveTo(cx, cy) : ctx.lineTo(cx, cy);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

    // 中央「!」警告マーク
    ctx.fillStyle = 'rgba(25,55,0,0.80)';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('!', 0, 0);
    ctx.restore();

    // 移動範囲インジケーター（黄緑パルスリング）
    const pulse = Math.sin(t * 4.5) * 0.3 + 0.7;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r + 7, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(170,255,30,${pulse * 0.55})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

// ══════════════════════════════════════════════════════════════════
// §加速パッド (Boost Pad)
// ══════════════════════════════════════════════════════════════════

/**
 * 加速パッド衝突判定: ビー玉がパッドに乗ったら速度ベクトルを加算する
 * 0.5秒のクールダウンで連続適用を防止
 */
function checkBoostPads() {
  if (!runtime.boostPads?.length) return;
  const t = performance.now() / 1000;
  for (const pad of runtime.boostPads) {
    const dx = ball.x - pad.x;
    const dy = ball.y - pad.y;
    if (dx * dx + dy * dy < (pad.r + BALL_R) * (pad.r + BALL_R)) {
      if (t - pad.lastHit > 0.5) {
        ball.vx += pad.dvx;
        ball.vy += pad.dvy;
        pad.lastHit = t;
      }
    }
  }
}

/** 加速パッドを描画: 方向矢印 + オレンジグロー + 踏んだ瞬間バースト */
function drawBoostPads() {
  if (!runtime.boostPads?.length) return;
  const t = performance.now() / 1000;
  for (const pad of runtime.boostPads) {
    const age   = t - pad.lastHit;
    const burst = age < 0.35 ? Math.sin((age / 0.35) * Math.PI) : 0;
    const pulse = 0.60 + 0.40 * Math.sin(t * 3.8 + pad.x * 0.04);

    ctx.save();
    ctx.translate(pad.x, pad.y);
    const angle = Math.atan2(pad.dvy, pad.dvx);
    ctx.rotate(angle);

    // 床グロー
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, pad.r + 12);
    glow.addColorStop(0, `rgba(255,150,0,${(0.40 * pulse + burst * 0.35).toFixed(2)})`);
    glow.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.beginPath();
    ctx.arc(0, 0, pad.r + 12, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    // 矢印本体 (→ 形)
    const R = pad.r * 0.88;
    ctx.beginPath();
    ctx.moveTo(-R,        -R * 0.33);
    ctx.lineTo( R * 0.18, -R * 0.33);
    ctx.lineTo( R * 0.18, -R * 0.62);
    ctx.lineTo( R,         0);
    ctx.lineTo( R * 0.18,  R * 0.62);
    ctx.lineTo( R * 0.18,  R * 0.33);
    ctx.lineTo(-R,         R * 0.33);
    ctx.closePath();
    const bright = Math.round(130 + burst * 90);
    ctx.fillStyle   = `rgba(255,${bright},10,${(0.80 + burst * 0.20).toFixed(2)})`;
    ctx.strokeStyle = 'rgba(160,50,0,0.70)';
    ctx.lineWidth   = 1.3;
    ctx.fill();
    ctx.stroke();

    // 踏んだ瞬間: 白フラッシュ
    if (burst > 0.05) {
      ctx.beginPath();
      ctx.arc(0, 0, pad.r + 4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,230,120,${(burst * 0.55).toFixed(2)})`;
      ctx.fill();
    }
    ctx.restore();

    // パッド中央に「▶▶」ラベル（回転せず固定表示）
    ctx.save();
    ctx.globalAlpha = 0.55 + burst * 0.35;
    ctx.font = 'bold 9px system-ui';
    ctx.fillStyle = 'rgba(255,220,80,0.95)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('▶▶', pad.x, pad.y);
    ctx.restore();
  }
}

/** 穴を描画する（黒く深い丸穴風・BRIO風番号付き） */
function drawHoles() {
  runtime.stage.holes.forEach((hole, i) => drawSingleHole(hole, i + 1));
  if (runtime.movingHoles) {
    const offset = runtime.stage.holes.length;
    runtime.movingHoles.forEach((hole, i) => {
      drawSingleHole(hole, offset + i + 1);
      drawMovingHoleIndicator(hole);
    });
  }
}

/** 移動穴の黄金パルスリングを描画（移動中であることを示す） */
function drawMovingHoleIndicator(hole) {
  const t = performance.now() / 1000;

  // ── 円軌道穴: 軌道サークルを薄い点線で表示 ──
  if (hole.orbit) {
    const pulse = Math.sin(t * 3.5) * 0.25 + 0.75;
    ctx.save();
    // 軌道円（薄い破線リング）
    ctx.beginPath();
    ctx.arc(hole.cx, hole.cy, hole.orbitR, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 80, 200, ${pulse * 0.35})`;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    // 穴本体のリング（ピンク〜マゼンタ）
    ctx.beginPath();
    ctx.arc(hole.x, hole.y, hole.r + 4, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 60, 180, ${pulse * 0.88})`;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.restore();
    return;
  }

  // ── 自由軌道穴: 移動範囲を薄い楕円で表示 ──
  if (hole.free) {
    const pulse = Math.sin(t * 4) * 0.25 + 0.75;
    ctx.save();
    // 移動範囲の楕円（薄い破線）
    ctx.beginPath();
    ctx.ellipse(hole.x0, hole.y0, hole.rx + hole.r, hole.ry + hole.r, 0, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(80, 200, 255, ${pulse * 0.28})`;
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
    // 穴本体のリング（シアン）
    ctx.beginPath();
    ctx.arc(hole.x, hole.y, hole.r + 4, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(40, 200, 255, ${pulse * 0.88})`;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.restore();
    return;
  }

  // ── 脈動穴: 赤/オレンジの呼吸リング ──
  if (hole.pulsing) {
    const pulse = 0.5 + 0.5 * Math.sin(t * hole.speed * Math.PI * 2 + hole.phase * Math.PI * 2);
    const ringR = hole.minR + (hole.maxR - hole.minR) * pulse + 5;
    ctx.save();
    // 内リング（赤〜オレンジ、穴と同期して拡縮）
    ctx.beginPath();
    ctx.arc(hole.x, hole.y, ringR, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 60, 60, ${0.50 + pulse * 0.45})`;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    // 外リング（最大サイズを示す薄い破線）
    ctx.beginPath();
    ctx.arc(hole.x, hole.y, hole.maxR + 7, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 100, 30, 0.25)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    return;
  }

  // ── 通常移動穴: 黄金パルスリング ──
  const pulse = Math.sin(t * 5) * 0.30 + 0.70; // 0.4〜1.0で脈動
  ctx.save();
  // 内リング（明るい金色）
  ctx.beginPath();
  ctx.arc(hole.x, hole.y, hole.r + 4, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(255, 215, 0, ${pulse * 0.90})`;
  ctx.lineWidth   = 2.5;
  ctx.stroke();
  // 外リング（薄めの光暈）
  ctx.beginPath();
  ctx.arc(hole.x, hole.y, hole.r + 8, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(255, 180, 0, ${pulse * 0.35})`;
  ctx.lineWidth   = 1.5;
  ctx.stroke();
  ctx.restore();
}

function drawSingleHole(hole, num) {
  ctx.save();
  // 外縁の木の縁
  ctx.beginPath();
  ctx.arc(hole.x, hole.y, hole.r + 3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(80,40,10,0.7)';
  ctx.fill();

  // 穴の影（深さ感）
  const shadow = ctx.createRadialGradient(hole.x-2, hole.y-2, 0, hole.x, hole.y, hole.r+2);
  shadow.addColorStop(0,   'rgba(0,0,0,0.85)');
  shadow.addColorStop(0.7, 'rgba(0,0,0,0.65)');
  shadow.addColorStop(1,   'rgba(20,8,0,0.3)');
  ctx.beginPath();
  ctx.arc(hole.x, hole.y, hole.r + 1, 0, Math.PI * 2);
  ctx.fillStyle = shadow;
  ctx.fill();

  // 穴の中心（最も暗い部分）
  ctx.beginPath();
  ctx.arc(hole.x, hole.y, hole.r * 0.55, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.95)';
  ctx.fill();

  // 吸引中のエフェクト（ビー玉が近づくと光る）
  const bDist = dist(ball.x, ball.y, hole.x, hole.y);
  const pullR = hole.r * PULL_RADIUS_MULT;
  if (bDist < pullR && runtime.status === S.PLAYING) {
    const intensity = (1 - bDist / pullR) * 0.45;
    ctx.beginPath();
    ctx.arc(hole.x, hole.y, hole.r + 6, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(220,100,20,${intensity})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // BRIO風番号（穴の縁に白抜き数字）
  if (num !== undefined) {
    const fs = Math.max(7, Math.round(hole.r * 0.60));
    ctx.font = `bold ${fs}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // 影で読みやすく
    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.strokeText(num, hole.x, hole.y + 0.5);
    ctx.fillStyle = 'rgba(255,215,140,0.88)';
    ctx.fillText(num, hole.x, hole.y + 0.5);
  }

  ctx.restore();
}

/** ゴールを描画する */
function drawGoal() {
  const g = runtime.stage.goal;
  ctx.save();
  // 外縁
  ctx.beginPath();
  ctx.arc(g.x, g.y, GOAL_R + 4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(30,100,30,0.55)';
  ctx.fill();
  // 本体（緑のグラデーション）
  const gGrad = ctx.createRadialGradient(g.x - 3, g.y - 3, 0, g.x, g.y, GOAL_R);
  gGrad.addColorStop(0,   '#6fdb6f');
  gGrad.addColorStop(0.5, '#2ea02e');
  gGrad.addColorStop(1,   '#0f6010');
  ctx.beginPath();
  ctx.arc(g.x, g.y, GOAL_R, 0, Math.PI * 2);
  ctx.fillStyle = gGrad;
  ctx.fill();
  // 「FINISH」テキスト（仕様: START/FINISH表示）
  ctx.fillStyle = 'rgba(255,255,220,0.95)';
  ctx.font = 'bold 9px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('FINISH', g.x, g.y);
  ctx.restore();
  // START表示
  const st = runtime.stage.start;
  ctx.save();
  ctx.fillStyle = 'rgba(30,60,160,0.5)';
  ctx.beginPath();
  ctx.arc(st.x, st.y, GOAL_R, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,220,0.88)';
  ctx.font = 'bold 9px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('START', st.x, st.y);
  ctx.restore();
}

/** レール（木製バー）を描画する */
function drawRails() {
  for (const rail of runtime.stage.rails) {
    drawSingleRail(rail);
  }
}

/**
 * 1本のレールを描画する（木製玩具らしい立体感のある棒）
 * ハイライト・影・丸みを付ける
 */
function drawSingleRail(rail) {
  const isIce    = runtime.stage?.physics?.ice;
  const isSpring = runtime.stage?.physics?.springWalls;
  const isBoth   = isIce && isSpring;  // 氷結バネ（Stage40用複合）
  const { x, y, w, h } = rail;
  const r = Math.min(w, h) / 2;

  ctx.save();

  // ── 影 ──
  ctx.shadowColor   = isBoth   ? 'rgba(0,20,60,0.50)'
                    : isIce    ? 'rgba(0,30,80,0.35)'
                    : isSpring ? 'rgba(0,60,20,0.45)'
                    :            'rgba(30,10,0,0.45)';
  ctx.shadowBlur    = 5;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 2;

  // ── 本体（木色 / 氷柱色 / バネ金属色 / 氷結バネ色） ──
  const bodyGrad = w >= h
    ? ctx.createLinearGradient(x, y, x, y + h)
    : ctx.createLinearGradient(x, y, x + w, y);
  if (isBoth) {
    bodyGrad.addColorStop(0,   '#0a3a52');
    bodyGrad.addColorStop(0.3, '#1a9ebe');
    bodyGrad.addColorStop(0.7, '#0e7a96');
    bodyGrad.addColorStop(1,   '#062a3c');
  } else if (isIce) {
    bodyGrad.addColorStop(0,   '#1c4a72');
    bodyGrad.addColorStop(0.3, '#2e6a9e');
    bodyGrad.addColorStop(0.7, '#1e5a88');
    bodyGrad.addColorStop(1,   '#153a5c');
  } else if (isSpring) {
    bodyGrad.addColorStop(0,   '#1a4a1a');
    bodyGrad.addColorStop(0.3, '#2e9e3e');
    bodyGrad.addColorStop(0.7, '#1e7a2e');
    bodyGrad.addColorStop(1,   '#0e3a14');
  } else {
    bodyGrad.addColorStop(0,   '#3a1a06');
    bodyGrad.addColorStop(0.3, '#5c2e0e');
    bodyGrad.addColorStop(0.7, '#4a2208');
    bodyGrad.addColorStop(1,   '#2e1004');
  }
  ctx.fillStyle = bodyGrad;
  roundRect(ctx, x, y, w, h, r);
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.shadowBlur  = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;

  // ── ハイライト ──
  const hlGrad = w >= h
    ? ctx.createLinearGradient(x, y, x, y + h * 0.4)
    : ctx.createLinearGradient(x, y, x + w * 0.4, y);
  if (isBoth) {
    hlGrad.addColorStop(0, 'rgba(140,255,255,0.65)');
    hlGrad.addColorStop(1, 'rgba(140,255,255,0)');
  } else if (isIce) {
    hlGrad.addColorStop(0, 'rgba(180,230,255,0.65)');
    hlGrad.addColorStop(1, 'rgba(180,230,255,0)');
  } else if (isSpring) {
    hlGrad.addColorStop(0, 'rgba(140,255,160,0.60)');
    hlGrad.addColorStop(1, 'rgba(140,255,160,0)');
  } else {
    hlGrad.addColorStop(0, 'rgba(220,150,60,0.55)');
    hlGrad.addColorStop(1, 'rgba(220,150,60,0)');
  }
  ctx.fillStyle = hlGrad;
  roundRect(ctx, x, y, w, h, r);
  ctx.fill();

  // ── バネ壁 / 氷結バネ: コイル模様（isBoth時はシアン） ──
  if (isSpring) {  // isBoth も isSpring===true なので自動適用
    ctx.save();
    roundRect(ctx, x, y, w, h, r);
    ctx.clip();
    ctx.strokeStyle = isBoth ? 'rgba(200,255,255,0.55)' : 'rgba(180,255,200,0.45)';
    ctx.lineWidth = 1.0;
    ctx.beginPath();
    const steps = Math.max(3, Math.floor(Math.max(w, h) / 9));
    if (w >= h) {
      const cy = y + h / 2;
      const amp = h * 0.22;
      for (let i = 0; i <= steps; i++) {
        const px = x + (w / steps) * i;
        const py = cy + (i % 2 === 0 ? -amp : amp);
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
    } else {
      const cx = x + w / 2;
      const amp = w * 0.22;
      for (let i = 0; i <= steps; i++) {
        const px = cx + (i % 2 === 0 ? -amp : amp);
        const py = y + (h / steps) * i;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  // ── 外枠線 ──
  ctx.strokeStyle = isBoth   ? 'rgba(0,20,60,0.65)'
                  : isIce    ? 'rgba(10,40,80,0.60)'
                  : isSpring ? 'rgba(0,60,20,0.70)'
                  :            'rgba(20,8,0,0.55)';
  ctx.lineWidth   = 0.7;
  roundRect(ctx, x, y, w, h, r);
  ctx.stroke();

  ctx.restore();
}

/** ctx.roundRect ポリフィル（一部ブラウザ未対応対策） */
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y,     x + w, y + r,     r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

/** ビー玉を描画する（ガラス玉風） */
function drawBall() {
  const br = ball.r * (1 - ball.sinkProgress * 0.85);
  if (br <= 0) return;

  const alpha = 1 - ball.sinkProgress * 0.9;
  const bx = ball.x;
  const by = ball.y;

  ctx.save();
  ctx.globalAlpha = alpha;

  // ── 影 ──
  ctx.shadowColor   = 'rgba(30,10,0,0.5)';
  ctx.shadowBlur    = 8;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 3;

  // ── 本体グラデーション（銀系ガラス玉） ──
  const bGrad = ctx.createRadialGradient(
    bx - br * 0.3, by - br * 0.3, br * 0.05,
    bx, by, br
  );
  bGrad.addColorStop(0,   '#e8f0ff');
  bGrad.addColorStop(0.35,'#90a8e0');
  bGrad.addColorStop(0.7, '#3050b0');
  bGrad.addColorStop(1,   '#102050');
  ctx.beginPath();
  ctx.arc(bx, by, br, 0, Math.PI * 2);
  ctx.fillStyle = bGrad;
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.shadowBlur  = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;

  // ── ハイライト（反射） ──
  const hlGrad = ctx.createRadialGradient(
    bx - br * 0.35, by - br * 0.38, 0,
    bx - br * 0.25, by - br * 0.25, br * 0.55
  );
  hlGrad.addColorStop(0,   'rgba(255,255,255,0.88)');
  hlGrad.addColorStop(0.5, 'rgba(255,255,255,0.28)');
  hlGrad.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.arc(bx, by, br, 0, Math.PI * 2);
  ctx.fillStyle = hlGrad;
  ctx.fill();

  // ── 小さな反射楕円 ──
  ctx.save();
  ctx.translate(bx + br * 0.22, by + br * 0.28);
  ctx.rotate(0.5);
  ctx.scale(1, 0.45);
  ctx.beginPath();
  ctx.arc(0, 0, br * 0.22, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(160,200,255,0.35)';
  ctx.fill();
  ctx.restore();

  // ── 大理石縞模様（回転で転がり感を演出） ──
  ctx.save();
  ctx.beginPath();
  ctx.arc(bx, by, br * 0.97, 0, Math.PI * 2);
  ctx.clip();
  ctx.translate(bx, by);
  ctx.rotate(ball.rotation * 0.28);
  for (let i = 0; i < 3; i++) {
    const ph = (i / 3) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(-br, Math.sin(ph) * br * 0.45);
    ctx.bezierCurveTo(
      -br * 0.35, Math.sin(ph + 0.9) * br * 0.28,
       br * 0.35, Math.cos(ph + 0.9) * br * 0.28,
       br, Math.cos(ph) * br * 0.45
    );
    ctx.strokeStyle = 'rgba(180,215,255,0.16)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }
  ctx.restore();

  ctx.restore();
}

/** デバッグ情報をCanvas上に描画する */
function drawDebugOverlay() {
  ctx.save();
  ctx.globalAlpha = 0.55;

  // レール当たり判定（外枠を青で表示）
  ctx.strokeStyle = '#0af';
  ctx.lineWidth   = 1;
  for (const rail of runtime.stage.rails) {
    ctx.strokeRect(rail.x, rail.y, rail.w, rail.h);
  }

  // 穴の吸引範囲（オレンジの円）
  ctx.strokeStyle = '#f80';
  ctx.lineWidth   = 1;
  for (const hole of runtime.stage.holes) {
    ctx.beginPath();
    ctx.arc(hole.x, hole.y, hole.r * PULL_RADIUS_MULT, 0, Math.PI * 2);
    ctx.stroke();
    // 穴の落下判定範囲（赤の円）
    ctx.strokeStyle = '#f00';
    ctx.beginPath();
    ctx.arc(hole.x, hole.y, hole.r * 0.7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = '#f80';
  }

  // ゴール判定範囲（緑の円）
  ctx.strokeStyle = '#0f0';
  ctx.lineWidth   = 1;
  const g = runtime.stage.goal;
  ctx.beginPath();
  ctx.arc(g.x, g.y, GOAL_R, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();
}

// ══════════════════════════════════════════════════════════════════
// §13. 効果音（Web Audio API による合成音）
// ══════════════════════════════════════════════════════════════════

let audioCtx = null;

/** AudioContext を遅延初期化する（ブラウザの自動再生制限対策） */
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

/**
 * 短い合成音を鳴らす
 * @param {number} freq - 周波数
 * @param {string} type - 波形
 * @param {number} dur  - 持続時間(秒)
 * @param {number} vol  - 音量
 */
function playTone(freq, type, dur, vol) {
  if (sfxVolume <= 0) return;
  try {
    const ac = getAudioCtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ac.currentTime);
    gain.gain.setValueAtTime(vol * sfxVolume, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    osc.start();
    osc.stop(ac.currentTime + dur);
  } catch (e) { /* 音が鳴らなくてもゲームに影響しない */ }
}

/** 壁衝突音（木製の鈍いコツン音） */
function playBump(speed) {
  if (Math.abs(speed) < 1.2 || sfxVolume <= 0) return;
  try {
    const ac = getAudioCtx();
    const vol = Math.min(Math.abs(speed) / MAX_SPEED * 0.10, 0.08) * sfxVolume;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(280, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(55, ac.currentTime + 0.05);
    gain.gain.setValueAtTime(vol, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.06);
    osc.start();
    osc.stop(ac.currentTime + 0.07);
  } catch(e) {}
}

/** 穴落下音（ヒュー↓と下降する笛音） */
function playFall() {
  if (sfxVolume <= 0) return;
  try {
    const ac = getAudioCtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(55, ac.currentTime + 0.85);
    gain.gain.setValueAtTime(0.14 * sfxVolume, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.9);
    osc.start();
    osc.stop(ac.currentTime + 0.9);
  } catch(e) {}
}

/** ゴール到達音（上昇アルペジオ） */
function playGoal() {
  [440, 554, 659, 880, 1108].forEach((f, i) => {
    setTimeout(() => playTone(f, 'sine', 0.28, 0.09), i * 70);
  });
}

// ── 転がり音（速度連動ノイズ） ──
let rollSrc = null, rollGain = null;

function ensureRollSound() {
  if (rollSrc || !audioCtx) return;
  try {
    const ac = audioCtx;
    const SR = ac.sampleRate;
    const buf = ac.createBuffer(1, SR >> 1, SR);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.35;
    rollSrc = ac.createBufferSource();
    rollSrc.buffer = buf;
    rollSrc.loop = true;
    const flt = ac.createBiquadFilter();
    flt.type = 'bandpass';
    flt.frequency.value = 200;
    flt.Q.value = 1.6;
    rollGain = ac.createGain();
    rollGain.gain.value = 0;
    rollSrc.connect(flt);
    flt.connect(rollGain);
    rollGain.connect(ac.destination);
    rollSrc.start();
  } catch(e) {}
}

/** ビー玉の転がり音を速度に応じて更新する */
function updateRollSound(spd) {
  if (!audioCtx) return;
  ensureRollSound();
  if (!rollGain) return;
  const vol = spd > 0.4 ? Math.min(spd / MAX_SPEED * 0.052, 0.052) * sfxVolume : 0;
  rollGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.06);
}

/** ステージ選択ボタンを生成する（初期化時に1回だけ呼ぶ） */
function createStageSelectUI() {
  const container = document.getElementById('stageSelect');
  container.innerHTML = '';
  for (let i = 0; i < TOTAL_STAGES; i++) {
    const btn = document.createElement('button');
    btn.className = 'ctrl stage-btn';
    btn.textContent = i + 1;
    btn.dataset.stage = i;
    btn.title = STAGE_DEFS[i].name || STAGE_DEFS[i].subtitle || '';
    const unlocked = isStageUnlocked(i);
    if (!unlocked) {
      btn.classList.add('locked');
      btn.disabled = true;
    } else if (clearedStages.has(i)) {
      btn.classList.add('cleared');
    }
    if (unlocked) {
      btn.addEventListener('click', () => {
        loadStage(Number(btn.dataset.stage));
        closeDrawer();
      });
    }
    container.appendChild(btn);
  }
}

/** ステージ選択ボタンのアクティブ・クリア・ロック状態を更新する */
function updateStageSelect() {
  document.querySelectorAll('.stage-btn').forEach(btn => {
    const i = Number(btn.dataset.stage);
    const unlocked = isStageUnlocked(i);
    // ロック解除：以前ロックされていたボタンが今回アンロックされた場合
    if (unlocked && btn.disabled) {
      btn.disabled = false;
      btn.classList.remove('locked');
      btn.addEventListener('click', () => {
        loadStage(Number(btn.dataset.stage));
        closeDrawer();
      });
    }
    btn.classList.toggle('active', i === runtime.stageIndex);
    if (!btn.disabled) {
      btn.classList.toggle('cleared', clearedStages.has(i) && i !== runtime.stageIndex);
    }
  });
}

/** HUDを更新する */
function updateHUD() {
  const stage = runtime.stage;
  if (!stage) return;
  stageNoEl.textContent   = `${stage.id}/${TOTAL_STAGES}`;
  stageNameEl.textContent = stage.subtitle;
  updateStageSelect();
  timerEl.textContent     = runtime.elapsedSec.toFixed(1);
  // プレイ中の星評価（リアルタイム更新）
  if (runtime.status === S.PLAYING) {
    const stars = evaluateStars(runtime.elapsedSec, stage.starTimes);
    starsEl.innerHTML = starsToHTML(stars, true);
  } else if (runtime.result) {
    starsEl.innerHTML = starsToHTML(runtime.result.stars, true);
  } else {
    starsEl.innerHTML = '---';
  }
}

/** クリアオーバーレイを表示する */
function showClearOverlay(stars, sec) {
  const isLast = (runtime.stageIndex >= TOTAL_STAGES - 1);
  ovTitle.textContent = 'ステージクリア！';
  // クリアタイム＋星評価を両方 Sub に表示して視認性を確保
  ovSub.textContent   = `クリアタイム: ${sec.toFixed(1)}秒`;
  ovStars.innerHTML   = starsToHTML(stars);
  // HUD 星バッジも強制更新
  starsEl.innerHTML   = starsToHTML(stars, true);
  overlay.className   = 'show clear';
  ovRestart.style.display = 'block';
  if (isLast) {
    ovNext.style.display = 'none';
    ovAll.style.display  = 'block';
    ovAll.textContent    = '全ステージ見る';

    ovNext.style.display = 'block';
    ovAll.style.display  = 'none';
  }

  nextBtn.disabled = isLast;
  restartBtn.disabled = false;

  onPlayEnd();
}
